spring:
  application:
    name: payment-api-study

    datasource:
      url: jdbc:h2:mem:payments
      driver-class-name: org.h2.Driver
      username: sa
      password:

      jpa:
        hibernate:
          ddl-auto: update

      h2:
        console:
          enabled: true
          path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.paymentapi: INFO